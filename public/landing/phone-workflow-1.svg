<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">NoteBill phone workflow rough notes to invoice</title>
  <desc id="desc">A polished phone-style mockup showing rough notes turning into a clean invoice draft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3fbf6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#143b31"/>
      <stop offset="100%" stop-color="#0f2f27"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5fbf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#143b31" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="150" cy="140" r="110" fill="#dff1e6" opacity=".7"/>
  <circle cx="1040" cy="150" r="130" fill="#f4e6d9" opacity=".8"/>
  <rect x="366" y="90" width="468" height="720" rx="56" fill="url(#phone)" filter="url(#shadow)"/>
  <rect x="398" y="134" width="404" height="624" rx="28" fill="#0f1f1b"/>
  <rect x="414" y="150" width="372" height="592" rx="24" fill="#fbfaf6"/>
  <rect x="548" y="114" width="104" height="10" rx="5" fill="#2c5e50" opacity=".9"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#143b31">Billie intake</text>
  <text x="600" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#56756a">Rough notes -> clean invoice</text>
  <rect x="440" y="280" width="320" height="84" rx="18" fill="url(#card)" stroke="#d8e6de"/>
  <text x="464" y="315" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#143b31">Job notes</text>
  <text x="464" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5e6f69">Leak fixed, 2.5h labor, parts, due in 14 days</text>
  <rect x="440" y="382" width="320" height="92" rx="18" fill="#f7fbf8" stroke="#d8e6de"/>
  <text x="464" y="417" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#143b31">Draft invoice</text>
  <text x="464" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5e6f69">Line items, tax, and due date all visible</text>
  <rect x="440" y="500" width="138" height="44" rx="22" fill="#17493c"/>
  <text x="509" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Build draft</text>
  <rect x="586" y="500" width="174" height="44" rx="22" fill="#ffffff" stroke="#cfded6"/>
  <text x="673" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#143b31">Review first</text>
  <rect x="440" y="570" width="320" height="110" rx="18" fill="#ffffff" stroke="#d8e6de"/>
  <text x="464" y="606" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#143b31">Money stays visible</text>
  <text x="464" y="634" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5e6f69">Approve the draft before save, export, or send.</text>
  <text x="600" y="845" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#143b31">Rough notes become a clean invoice fast</text>
</svg>
